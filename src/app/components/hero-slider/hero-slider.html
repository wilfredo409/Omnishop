<!-- ─── HERO SLIDER ─── -->
<section class="hero-slider">

  <div class="slides-wrap">
    <div
      *ngFor="let slide of slides; let i = index"
      class="slide"
      [class.active]="i === currentIndex"
    >
      <img [src]="slide.image" [alt]="slide.label" />
      <div class="overlay">
        <span class="label">{{ slide.label }}</span>
        <h1 class="title">{{ slide.title }}</h1>
        <!-- Botón CTA: emite la categoría al padre en lugar de solo hacer scroll -->
        <button class="cta-btn" (click)="onCtaClick(slide.categoria)">
          {{ slide.cta }} <i class="bi bi-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <button class="nav-btn prev" (click)="prev()">
    <i class="bi bi-chevron-left"></i>
  </button>
  <button class="nav-btn next" (click)="next()">
    <i class="bi bi-chevron-right"></i>
  </button>

  <div class="indicators">
    <button
      *ngFor="let slide of slides; let i = index"
      class="dot"
      [class.active]="i === currentIndex"
      (click)="goTo(i)"
    ></button>
  </div>

</section>
